version: '3.8'
services:
  mongodb:
    image: mongo:7
    container_name: insightiq-mongo
    ports: ['27017:27017']
    volumes: [mongo_data:/data/db]
    environment:
      MONGO_INITDB_DATABASE: insightiq

  backend:
    build: { context: ./backend, dockerfile: ../Dockerfile.backend }
    container_name: insightiq-backend
    ports: ['5000:5000']
    depends_on: [mongodb]
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: insightiq
      JWT_SECRET_KEY: change-in-production
      SECRET_KEY: change-in-production
      FLASK_DEBUG: 'False'
    volumes: ['./backend/uploads:/app/uploads']

  frontend:
    build: { context: ./frontend, dockerfile: ../Dockerfile.frontend }
    container_name: insightiq-frontend
    ports: ['3000:80']
    depends_on: [backend]

volumes:
  mongo_data:
